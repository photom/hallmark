# cargo-deny configuration: known vulnerabilities, licenses, banned crates,
# and allowed sources. CI runs `cargo deny --all-features check`, and runs it
# on the fuzz crate in fuzz/ too.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licenses compatible with distributing hallmark under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# libfuzzer-sys holds LLVM's libFuzzer under the NCSA license. Only the fuzz
# crate uses it, and that crate is never published or shipped (ADR 0069).
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# hallmark-wasm and the fuzz crate depend on hallmark by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
