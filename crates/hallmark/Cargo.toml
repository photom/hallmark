[package]
name = "hallmark"
description = "Email sender authentication: SPF, DKIM, DKIM2 and DMARC, with a trace that explains every step"
version.workspace = true
rust-version = "1.88"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["dkim", "spf", "dmarc", "email", "authentication"]
categories = ["email", "authentication", "wasm"]

[lints]
workspace = true

[features]
# DKIM2 targets IETF drafts, and its API can change in any release (DK2-001,
# DK2-005).
unstable-dkim2 = []

[package.metadata.docs.rs]
all-features = true

