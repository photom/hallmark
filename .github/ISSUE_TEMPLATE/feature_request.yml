name: Feature request
description: Propose a specific new feature or a change to existing behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why hallmark does not let you do it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How the feature should behave. Include the API you have in mind, if any.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - SPF
        - DKIM
        - DKIM2
        - DMARC
        - Authentication-Results
        - Trace
        - Streaming and DNS interfaces
        - WebAssembly or the demo
        - Something else
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve the problem, including workarounds you use now.
  - type: textarea
    id: references
    attributes:
      label: References
      description: The RFC or draft sections that describe the behavior.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
