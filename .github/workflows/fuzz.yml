name: Fuzz

# The fuzz targets in fuzz/ (SAF-003, TST-005, ADR 0069): a short run on each
# change, and a longer one every week and on a manual run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# The event is part of the group, so a push to main never cancels the weekly
# run.
concurrency:
  group: fuzz-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: Fuzz dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny reads deny.toml from the root, where the action runs, so
      # the workspace's rules cover the fuzz crate too (ADR 0049).
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: fuzz/Cargo.toml
          command: check

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    # The weekly run takes 600 seconds a target, plus the builds.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz needs a nightly toolchain for its sanitizer flags. Only this
      # job uses one; the commands below name it with +nightly.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      # The fuzz crate is outside the workspace, so the Format job of CI skips
      # it. rust-toolchain.toml selects the toolchain here.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      # Each run starts from the corpus that the earlier runs built.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run every target
        env:
          SECONDS_PER_TARGET: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '600' || '60' }}
        # An input that takes over 10 seconds fails as a timeout. Each corpus is
        # minimized before the cache keeps it.
        run: |
          targets=$(cargo +nightly fuzz list)
          test -n "$targets"
          for target in $targets; do
            echo "Fuzzing $target for $SECONDS_PER_TARGET seconds"
            cargo +nightly fuzz run "$target" -- -max_total_time="$SECONDS_PER_TARGET" -timeout=10
            cargo +nightly fuzz cmin "$target"
          done
      # The inputs that made a target fail, to reproduce the fault.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
