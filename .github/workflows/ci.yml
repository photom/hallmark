name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml selects the toolchain, its components, and the
      # wasm32-unknown-unknown target.
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # -D warnings turns the disallowed methods of clippy.toml and the panic
      # lints of Cargo.toml into errors.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The core must build for the browser with every feature (WSM-001).
      - run: cargo clippy -p hallmark -p hallmark-wasm --target wasm32-unknown-unknown --all-features -- -D warnings
      - run: cargo build -p hallmark -p hallmark-wasm --target wasm32-unknown-unknown --all-features

  # The tests run on Rocky Linux 9 and Debian 13, in containers on the hosted
  # runner (TST-007, ADR 0053). The other jobs check tools and run on the
  # runner itself.
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rocky Linux 9
            image: rockylinux/rockylinux:9
          - name: Debian 13
            image: debian:trixie
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      # The Rocky Linux image sets no PATH, and if a step adds to the path, the
      # runner gives later steps a PATH with only the added directories. The
      # job sets the whole PATH here instead, and installs Rust under
      # /usr/local, outside the HOME that the runner chooses.
      env:
        RUSTUP_HOME: /usr/local/rustup
        CARGO_HOME: /usr/local/cargo
        PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install the build tools
        run: |
          if command -v dnf > /dev/null; then
            dnf install -y gcc git
          else
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl gcc git libc6-dev
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the toolchain that rust-toolchain.toml names.
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
      - run: rustup toolchain install
      # The action's own cache key leaves out the matrix, so the image keeps
      # the two caches apart. A build script built against Debian's glibc
      # can't run on Rocky Linux's older one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.image }}
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --no-default-features

  msrv:
    name: MSRV (Rust 1.88, library only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The MSRV covers the hallmark library (STB-003, ADR 0036). The tests and
      # hallmark-wasm may need a newer Rust, so this job checks the library alone.
      - run: cargo +1.88 check -p hallmark --lib --all-features
      - run: cargo +1.88 check -p hallmark --lib --no-default-features

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The declarations under #[cfg(doc)] compile only here (ADR 0052), so
      # the job builds them without features too. The build with every
      # feature runs last, because the link check reads its output.
      - run: cargo doc --workspace --no-deps --no-default-features
      - run: cargo doc --workspace --no-deps --all-features
      # Relative links in the Markdown documents, links from doc comments to
      # the documents, and links to the API reference checked against the
      # rustdoc just built (ADR 0052).
      - run: python3 -I .github/scripts/check-links.py --doc target/doc

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          arguments: --all-features
