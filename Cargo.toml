[workspace]
members = ["crates/hallmark", "crates/hallmark-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/photom/hallmark"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# No message, DNS answer, or record may make hallmark panic. clippy.toml
# allows these in tests.
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"
# These lints suggest a method that takes a closure, such as map, filter,
# find, retain, or entry().or_insert_with(). hallmark writes the match or
# the loop instead.
manual_filter = "allow"
manual_filter_map = "allow"
manual_find = "allow"
manual_find_map = "allow"
manual_map = "allow"
manual_retain = "allow"
map_entry = "allow"
